<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">rgnix — programmable HTTP in Rust</title>
  <desc id="desc">NGINX-style configuration and compiled Lua-style routing in one binary. Example: select a canary upstream with a request header.</desc>
  <rect width="1280" height="440" rx="20" fill="#F3F2EC"/>
  <path d="M44 350H568M44 376H568M44 402H568" stroke="#DDDFD5"/>
  <path d="M48 53H76L94 71H125M76 53L94 35H125" stroke="#087F70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="130" cy="35" r="5" fill="#EA6A31"/>
  <circle cx="130" cy="71" r="5" fill="#087F70"/>
  <text x="156" y="58" fill="#4F5E59" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">PROGRAMMABLE HTTP</text>
  <text x="42" y="193" fill="#152D28" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="750" font-size="112" letter-spacing="-7">rgnix<tspan fill="#EA6A31">.</tspan></text>
  <text x="48" y="246" fill="#233E36" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="600">One binary. Your routing logic.</text>
  <text x="48" y="282" fill="#586760" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19">HTTP server · Reverse proxy · Kubernetes Ingress</text>
  <rect x="48" y="322" width="77" height="30" rx="15" fill="#DFE7DC"/>
  <text x="86.5" y="342" text-anchor="middle" fill="#2D4B3D" font-family="ui-monospace,Consolas,monospace" font-size="13">RUST</text>
  <rect x="135" y="322" width="101" height="30" rx="15" fill="#DFE7DC"/>
  <text x="185.5" y="342" text-anchor="middle" fill="#2D4B3D" font-family="ui-monospace,Consolas,monospace" font-size="13">PINGORA</text>
  <rect x="246" y="322" width="130" height="30" rx="15" fill="#DFE7DC"/>
  <text x="311" y="342" text-anchor="middle" fill="#2D4B3D" font-family="ui-monospace,Consolas,monospace" font-size="13">WEBASSEMBLY</text>
  <rect x="610" y="35" width="630" height="370" rx="15" fill="#142C27"/>
  <path d="M610 87H1240" stroke="#30453E"/>
  <circle cx="637" cy="61" r="5" fill="#EB7851"/>
  <circle cx="656" cy="61" r="5" fill="#DEC56E"/>
  <circle cx="675" cy="61" r="5" fill="#81B598"/>
  <text x="706" y="66" fill="#A5B9AB" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">routes.rgl</text>
  <text x="1176" y="66" text-anchor="end" fill="#95AB9D" font-family="ui-monospace,Consolas,monospace" font-size="12">v0.2 / preview</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">
    <text x="638" y="127" fill="#9EC1AC">function <tspan fill="#F1F0DE">on_request()</tspan></text>
    <text x="658" y="162" fill="#D0DED3">if req.header(<tspan fill="#EDC184">"x-canary"</tspan>) == <tspan fill="#EDC184">"1"</tspan> then</text>
    <text x="678" y="197" fill="#D0DED3">return route.proxy(<tspan fill="#EDC184">"canary"</tspan>)</text>
    <text x="658" y="232" fill="#9EC1AC">end</text>
    <text x="658" y="267" fill="#D0DED3">return route.pass()</text>
    <text x="638" y="302" fill="#9EC1AC">end</text>
  </g>
  <path d="M638 326H1212" stroke="#30453E"/>
  <circle cx="643" cy="367" r="5" fill="#B1D4AC"/>
  <text x="660" y="372" fill="#C5D5C8" font-family="ui-monospace,Consolas,monospace" font-size="14">RGL → Wasm → native code</text>
  <text x="48" y="405" fill="#607068" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="1.2">NGINX-STYLE CONFIG. COMPILED ROUTING.</text>
</svg>
