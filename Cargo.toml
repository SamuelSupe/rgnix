[package]
name = "rgnix"
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
description = "A programmable Rust HTTP server and Kubernetes Ingress controller"
license = "Apache-2.0"
repository = "https://github.com/SamuelSupe/rgnix"
readme = "README.md"

[features]
default = ["hyper-experimental"]
hyper-experimental = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tower-service", "dep:tokio-openssl", "dep:socket2"]
http3 = ["hyper-experimental", "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:rustls"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
cap-std = "3"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
env_logger = "0.11"
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
futures = "0.3"
glob = "0.3"
http = "1"
httpdate = "1"
http-body-util = { version = "0.1.5", optional = true }
hyper = { path = "vendor/hyper", version = "1.11.1", features = ["server", "client", "http1", "http2", "rgnix-full-body", "rgnix-reuse-buffer", "rgnix-extensions"], optional = true }
hyper-util = { path = "vendor/hyper-util", version = "0.1.20", features = ["client-legacy", "server-auto", "http1", "http2", "tokio", "rgnix-sendfile"], optional = true }
h3 = { version = "0.0.8", path = "vendor/h3", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
tokio-openssl = { version = "0.6", optional = true }
tower-service = { version = "0.3", optional = true }
ipnet = { version = "2", features = ["serde"] }
hickory-resolver = "0.25"
jsonwebtoken = "9.3"
k8s-openapi = { version = "0.26", features = ["v1_34"] }
kube = { version = "2", default-features = false, features = ["client", "runtime", "openssl-tls"] }
libc = "0.2"
log = "0.4"
memchr = "2"
openssl = "0.10"
object = { version = "0.36.7", default-features = false, features = ["read", "elf"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs", "trace"] }
percent-encoding = "2"
pingora = { version = "0.9", features = ["proxy", "openssl"] }
prometheus = { version = "0.14", features = ["process"] }
prost = "0.14"
rand = "0.8"
redis = { version = "1.7", default-features = false, features = ["tokio-native-tls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking", "http2"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
url = "2"
wasm-encoder = "0.239"
wasmparser = { version = "0.239", default-features = false, features = ["std"] }
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std", "pooling-allocator"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14.0"
socket2 = { version = "0.6", features = ["all"], optional = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
h3 = { path = "vendor/h3" }
pingora-core = { path = "vendor/pingora-core" }
pingora-proxy = { path = "vendor/pingora-proxy" }
pingora-timeout = { path = "vendor/pingora-timeout" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
