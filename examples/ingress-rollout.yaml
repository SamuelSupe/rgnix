apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  namespace: payments
  annotations:
    rgnix.io/traffic-policy: |
      {
        "revision": "checkout-v3",
        "backends": [
          {"service":"checkout-stable:http","weight":90},
          {"service":"checkout-canary:http","weight":10}
        ],
        "cohort": "cookie:release-user",
        "mirror": {"service":"checkout-shadow:http","percent":5,"max_body_bytes":65536,"timeout_ms":500},
        "rollback": {"fallback":"checkout-stable:http","min_requests":100,"error_percent":5,"window_seconds":60,"max_p95_ms":500},
        "steps": [
          {"weights":{"checkout-stable:http":90,"checkout-canary:http":10},"duration_seconds":60,"min_requests":100,"approval":true},
          {"weights":{"checkout-stable:http":50,"checkout-canary:http":50},"duration_seconds":120,"min_requests":100,"approval":true},
          {"weights":{"checkout-stable:http":0,"checkout-canary:http":100},"duration_seconds":120,"min_requests":100,"approval":false}
        ]
      }
spec:
  ingressClassName: rgnix
  rules:
    - host: checkout.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout-stable
                port:
                  name: http
