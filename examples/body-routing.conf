events {}
http {
    upstream app { server 127.0.0.1:9001; }
    upstream canary { server 127.0.0.1:9002; }
    server {
        listen 8080;
        server_name localhost;
        rgnix_request_body_timeout 2s;
        location /api/ {
            proxy_pass http://app;
            rgnix_script body-json.rgl;
            rgnix_request_body full 64k;
        }
        location /ingest/ {
            proxy_pass http://app;
            client_max_body_size 20m;
            rgnix_script body-prefix.rgl;
            rgnix_request_body prefix 4k;
        }
    }
}
