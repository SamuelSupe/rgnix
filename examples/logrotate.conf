# Use rgnix_log_rotation off and a writable log directory.
# This example expects an existing systemd unit named rgnix.service.
/var/log/rgnix/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /bin/systemctl kill --kill-whom=main --signal=USR1 rgnix.service
    endscript
}
