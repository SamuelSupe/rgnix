name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev openssl curl python3 python3-grpcio python3-brotli logrotate redis-server clang iproute2 xdp-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check.sh
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - name: XDP kernel and isolated network regression
        run: |
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          sudo python3 scripts/xdp_integration.py target/debug/rgnix --libxdp --output .local/xdp-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xdp-validation
          include-hidden-files: true
          path: .local/xdp-validation.json
      - uses: azure/setup-helm@v4
      - run: helm lint charts/rgnix
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: rgnix:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
