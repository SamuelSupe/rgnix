{{- if .Values.xdp.enabled }}
{{- $image := printf "%s:%s" .Values.xdp.image.repository (required "xdp.image.tag must select an image with XDP ABI 2" .Values.xdp.image.tag) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-xdp
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: {{ .Values.xdp.minReadySeconds }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rgnix-xdp
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.xdp.maxUnavailable }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rgnix-xdp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      nodeSelector:
        {{- toYaml .Values.xdp.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.xdp.tolerations | nindent 8 }}
      initContainers:
        - name: verify-policy
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.xdp.image.pullPolicy }}
          args: [xdp, check, {{ printf "/policy/%s" .Values.xdp.policyKey | quote }}, --config, {{ printf "/policy/%s" .Values.xdp.configKey | quote }}, --kernel]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [BPF, NET_ADMIN, PERFMON]
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      containers:
        - name: xdp
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.xdp.image.pullPolicy }}
          args:
            - xdp
            - run
            - {{ printf "/policy/%s" .Values.xdp.policyKey | quote }}
            - --config
            - {{ printf "/policy/%s" .Values.xdp.configKey | quote }}
            - --interface
            - {{ .Values.xdp.interface | quote }}
            - --mode
            - {{ .Values.xdp.mode | quote }}
            - --admin
            - {{ .Values.xdp.admin | quote }}
            - --watch-interval
            - {{ .Values.xdp.watchInterval | quote }}
            {{- if .Values.xdp.persist }}
            - --persist
            {{- end }}
            {{- if .Values.xdp.history }}
            - --history-dir
            - /var/lib/rgnix-xdp
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_SERVICE_NAME
              value: rgnix-xdp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.node.name=$(NODE_NAME)"
            {{- if .Values.xdp.otlpLogsEndpoint }}
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: {{ .Values.xdp.otlpLogsEndpoint | quote }}
            {{- end }}
            {{- if .Values.xdp.otlpHeadersSecret }}
            - name: OTEL_EXPORTER_OTLP_LOGS_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.xdp.otlpHeadersSecret }}
                  key: headers
            {{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [BPF, NET_ADMIN, PERFMON]
            seccompProfile:
              type: Unconfined
          resources:
            {{- toYaml .Values.xdp.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [rgnix, xdp, status, --ready, --admin, {{ .Values.xdp.admin | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [rgnix, xdp, status, --health, --admin, {{ .Values.xdp.admin | quote }}]
            periodSeconds: 10
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: locks
              mountPath: /run/rgnix-xdp
            {{- if .Values.xdp.history }}
            - name: history
              mountPath: /var/lib/rgnix-xdp
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ required "xdp.policyConfigMap is required" .Values.xdp.policyConfigMap }}
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: locks
          hostPath:
            path: /run/rgnix-xdp
            type: DirectoryOrCreate
        {{- if .Values.xdp.history }}
        - name: history
          hostPath:
            path: /var/lib/rgnix-xdp
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
