{{- $shutdown := mergeOverwrite (dict "enabled" false "preStopSeconds" 10 "graceSeconds" 5 "timeoutSeconds" 25 "terminationGracePeriodSeconds" 60) (default dict .Values.shutdown) }}
{{- if le (int $shutdown.terminationGracePeriodSeconds) (int (add $shutdown.preStopSeconds $shutdown.graceSeconds $shutdown.timeoutSeconds)) }}
{{- fail "terminationGracePeriodSeconds must exceed preStopSeconds + graceSeconds + timeoutSeconds" }}
{{- end }}
{{- if not (has .Values.mode (list "ingress" "gateway")) }}
{{- fail "mode must be ingress or gateway" }}
{{- end }}
{{- if and .Values.requireMultipleNodes (lt (int .Values.replicaCount) 2) }}
{{- fail "requireMultipleNodes requires at least two replicas" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
rules:
  {{- if eq .Values.mode "gateway" }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  {{- if not .Values.watchNamespaces }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways/status, httproutes/status, grpcroutes/status, backendtlspolicies/status]
    verbs: [get, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes]
    verbs: [patch]
  {{- end }}
  {{- end }}
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  {{- if not .Values.watchNamespaces }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingresses/status]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-watch
  namespace: {{ . | quote }}
rules:
  {{- if eq $.Values.mode "gateway" }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways/status, httproutes/status, grpcroutes/status, backendtlspolicies/status]
    verbs: [get, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes]
    verbs: [patch]
  {{- end }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingresses/status]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-watch
  namespace: {{ . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-watch
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leader
rules:
  {{- if eq .Values.mode "gateway" }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways/status, httproutes/status, grpcroutes/status, backendtlspolicies/status]
    verbs: [get, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes]
    verbs: [patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs:
      - get
      - create
      - update
      - list
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-leader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
{{- if eq .Values.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClass }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: {{ .Values.defaultIngressClass | quote }}
spec:
  controller: rgnix.io/ingress-controller
{{- else }}
{{- if .Values.gateway.createClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: rgnix.io/gateway-controller
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default .Release.Name .Values.gateway.name }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rgnix
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: {{ $shutdown.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          {{- if .Values.requireMultipleNodes }}
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          {{- else }}
          whenUnsatisfiable: ScheduleAnyway
          {{- end }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rgnix
              app.kubernetes.io/instance: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rgnix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if eq .Values.mode "gateway" }}
            - gateway
            - --gateway={{ .Release.Namespace }}/{{ default .Release.Name .Values.gateway.name }}
            - --http-port={{ .Values.service.httpPort }}
            - --https-port={{ .Values.service.httpsPort }}
            {{- else }}
            - ingress
            - --ingress-class={{ .Values.ingressClass }}
            {{- end }}
            {{- range .Values.watchNamespaces }}
            - --watch-namespace={{ . }}
            {{- end }}
            - --publish-service={{ .Release.Namespace }}/{{ .Release.Name }}
            {{- if .Values.globalRateLimit.secret.name }}
            - --global-rate-limit-file=/etc/rgnix/global-rate-limit/config.json
            {{- end }}
            {{- if .Values.rolloutMetrics.secret.name }}
            - --rollout-metrics-file=/etc/rgnix/release-metrics/metrics.json
            {{- end }}
            {{- if .Values.admission.enabled }}
            - --admission-listen=0.0.0.0:9443
            - --admission-tls-cert=/etc/rgnix/admission/tls.crt
            - --admission-tls-key=/etc/rgnix/admission/tls.key
            - --admission-controller-user=system:serviceaccount:{{ .Release.Namespace }}:{{ .Release.Name }}
            {{- end }}
            - --threads={{ .Values.threads }}
            {{- if $shutdown.enabled }}
            - --drain-file=/var/run/rgnix/drain
            - --shutdown-grace-seconds={{ $shutdown.graceSeconds }}
            - --shutdown-timeout-seconds={{ $shutdown.timeoutSeconds }}
            {{- end }}
            {{- if .Values.reportReplicas }}
            - --report-replicas
            {{- end }}
            - --max-inflight={{ .Values.maxInflight }}
            - --max-plugin-instances={{ .Values.maxPluginInstances }}
            - --upstream-max-fails={{ .Values.upstreamMaxFails }}
            - --upstream-fail-timeout-secs={{ .Values.upstreamFailTimeoutSeconds }}
            - --real-ip-header={{ .Values.forwarding.header }}
            {{- range .Values.forwarding.trustedProxies }}
            - --trusted-proxy={{ . }}
            {{- end }}
            {{- if .Values.forwarding.recursive }}
            - --real-ip-recursive
            {{- end }}
            {{- if .Values.forwarding.proxyProtocol }}
            - --proxy-protocol
            {{- end }}
            {{- if .Values.admin.usersSecret.name }}
            - --admin-users-file=/etc/rgnix/admin-users/users.json
            {{- end }}
            {{- if .Values.admin.tokenSecret.name }}
            - --admin-token-file=/etc/rgnix/admin/token
            {{- end }}
            {{- if .Values.admin.readTokenSecret.name }}
            - --admin-read-token-file=/etc/rgnix/admin-read/token
            {{- end }}
            {{- if .Values.tenancy.policyConfigMap.name }}
            - --tenant-policy-file=/etc/rgnix/tenancy/policy.json
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if or .Values.otlpLogs.endpoint .Values.otlpTraces.endpoint }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otlpLogs.serviceName | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "k8s.namespace.name=%s,k8s.pod.name=$(POD_NAME)%s" .Release.Namespace (ternary (printf ",%s" .Values.otlpLogs.resourceAttributes) "" (ne .Values.otlpLogs.resourceAttributes "")) | quote }}
            {{- end }}
            {{- if .Values.otlpLogs.endpoint }}
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: {{ .Values.otlpLogs.endpoint | quote }}
            {{- if .Values.otlpLogs.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_LOGS_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpLogs.headersSecret.name | quote }}
                  key: {{ .Values.otlpLogs.headersSecret.key | quote }}
            {{- end }}
            {{- if .Values.otlpLogs.caConfigMap.name }}
            - name: OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE
              value: /etc/rgnix/otlp-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.otlpTraces.endpoint }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.otlpTraces.endpoint | quote }}
            - name: RGNIX_TRACE_SAMPLE_RATIO
              value: {{ .Values.otlpTraces.sampleRatio | quote }}
            {{- if .Values.otlpTraces.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otlpTraces.headersSecret.name | quote }}
                  key: {{ .Values.otlpTraces.headersSecret.key | quote }}
            {{- end }}
            {{- if .Values.otlpTraces.caConfigMap.name }}
            - name: OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE
              value: /etc/rgnix/trace-ca/ca.crt
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            {{- if .Values.admission.enabled }}
            - name: admission
              containerPort: 9443
            {{- end }}
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: admin
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                {{- if $shutdown.enabled }}
                command: ["/bin/sh", "-c", {{ printf "touch /var/run/rgnix/drain; sleep %v" $shutdown.preStopSeconds | quote }}]
                {{- else }}
                command: ["/bin/sleep", "5"]
                {{- end }}
          volumeMounts:
            - name: drain
              mountPath: /var/run/rgnix
            {{- if .Values.globalRateLimit.secret.name }}
            - name: global-rate-limit
              mountPath: /etc/rgnix/global-rate-limit
              readOnly: true
            {{- end }}
            {{- if .Values.admission.enabled }}
            - name: admission-tls
              mountPath: /etc/rgnix/admission
              readOnly: true
            {{- end }}
            {{- if .Values.rolloutMetrics.secret.name }}
            - name: release-metrics
              mountPath: /etc/rgnix/release-metrics
              readOnly: true
            {{- end }}
            {{- if .Values.admin.usersSecret.name }}
            - name: admin-users
              mountPath: /etc/rgnix/admin-users
              readOnly: true
            {{- end }}
            {{- if .Values.admin.readTokenSecret.name }}
            - name: admin-read-token
              mountPath: /etc/rgnix/admin-read
              readOnly: true
            {{- end }}
            {{- if .Values.tenancy.policyConfigMap.name }}
            - name: tenancy
              mountPath: /etc/rgnix/tenancy
              readOnly: true
            {{- end }}
            {{- if and .Values.otlpLogs.endpoint .Values.otlpLogs.caConfigMap.name }}
            - name: otlp-ca
              mountPath: /etc/rgnix/otlp-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.otlpTraces.endpoint .Values.otlpTraces.caConfigMap.name }}
            - name: trace-ca
              mountPath: /etc/rgnix/trace-ca
              readOnly: true
            {{- end }}
            {{- if .Values.admin.tokenSecret.name }}
            - name: admin-token
              mountPath: /etc/rgnix/admin
              readOnly: true
            {{- end }}
      volumes:
        - name: drain
          emptyDir: {}
        {{- if .Values.globalRateLimit.secret.name }}
        - name: global-rate-limit
          secret:
            secretName: {{ .Values.globalRateLimit.secret.name | quote }}
            items:
              - key: {{ .Values.globalRateLimit.secret.key | quote }}
                path: config.json
        {{- end }}
        {{- if .Values.admission.enabled }}
        - name: admission-tls
          secret:
            secretName: {{ required "admission.tlsSecret is required" .Values.admission.tlsSecret | quote }}
        {{- end }}
        {{- if .Values.rolloutMetrics.secret.name }}
        - name: release-metrics
          secret:
            secretName: {{ .Values.rolloutMetrics.secret.name | quote }}
            items:
              - key: {{ .Values.rolloutMetrics.secret.key | quote }}
                path: metrics.json
        {{- end }}
        {{- if .Values.admin.usersSecret.name }}
        - name: admin-users
          secret:
            secretName: {{ .Values.admin.usersSecret.name | quote }}
            items:
              - key: {{ .Values.admin.usersSecret.key | quote }}
                path: users.json
        {{- end }}
        {{- if .Values.admin.readTokenSecret.name }}
        - name: admin-read-token
          secret:
            secretName: {{ .Values.admin.readTokenSecret.name | quote }}
            items:
              - key: {{ .Values.admin.readTokenSecret.key | quote }}
                path: token
        {{- end }}
        {{- if .Values.tenancy.policyConfigMap.name }}
        - name: tenancy
          configMap:
            name: {{ .Values.tenancy.policyConfigMap.name | quote }}
            items:
              - key: {{ .Values.tenancy.policyConfigMap.key | quote }}
                path: policy.json
        {{- end }}
        {{- if and .Values.otlpLogs.endpoint .Values.otlpLogs.caConfigMap.name }}
        - name: otlp-ca
          configMap:
            name: {{ .Values.otlpLogs.caConfigMap.name | quote }}
            items:
              - key: {{ .Values.otlpLogs.caConfigMap.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if and .Values.otlpTraces.endpoint .Values.otlpTraces.caConfigMap.name }}
        - name: trace-ca
          configMap:
            name: {{ .Values.otlpTraces.caConfigMap.name | quote }}
            items:
              - key: {{ .Values.otlpTraces.caConfigMap.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.admin.tokenSecret.name }}
        - name: admin-token
          secret:
            secretName: {{ .Values.admin.tokenSecret.name | quote }}
            items:
              - key: {{ .Values.admin.tokenSecret.key | quote }}
                path: token
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  allocateLoadBalancerNodePorts: {{ .Values.service.allocateLoadBalancerNodePorts }}
  {{- if .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.service.loadBalancerClass }}
  {{- end }}
  {{- end }}
  selector:
    app.kubernetes.io/name: rgnix
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rgnix
      app.kubernetes.io/instance: {{ .Release.Name }}

{{- if .Values.admission.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admission
spec:
  selector:
    app.kubernetes.io/name: rgnix
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: admission
      port: 443
      targetPort: admission
{{- end }}
{{- if and .Values.admission.enabled .Values.admission.register }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
  {{- if .Values.admission.certManagerCertificate }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace .Values.admission.certManagerCertificate | quote }}
  {{- end }}
webhooks:
  - name: {{ .Values.mode }}.rgnix.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.admission.failurePolicy }}
    matchPolicy: Equivalent
    timeoutSeconds: 10
    matchConditions:
      - name: selected-controller
        expression: >-
          {{- if eq .Values.mode "gateway" }}
          [object, oldObject].exists(o, o != null &&
            (request.kind.kind == 'Gateway' ?
              o.metadata.namespace == {{ .Release.Namespace | squote }} && o.metadata.name == {{ default .Release.Name .Values.gateway.name | squote }} :
              has(o.spec.parentRefs) && o.spec.parentRefs.exists(p,
                (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
                (!has(p.kind) || p.kind == 'Gateway') &&
                p.name == {{ default .Release.Name .Values.gateway.name | squote }} &&
                (has(p.namespace) ? p.namespace : o.metadata.namespace) == {{ .Release.Namespace | squote }})))
          {{- else }}
          [object, oldObject].exists(o, o != null &&
            (has(o.spec.ingressClassName) ? o.spec.ingressClassName == {{ .Values.ingressClass | squote }} : {{ .Values.defaultIngressClass }}))
          {{- end }}
    {{- if .Values.watchNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ if eq .Values.mode "gateway" }}{{ append .Values.watchNamespaces .Release.Namespace | uniq | toJson }}{{ else }}{{ .Values.watchNamespaces | toJson }}{{ end }}
    {{- else }}
    namespaceSelector:
      {{- toYaml .Values.admission.namespaceSelector | nindent 6 }}
    {{- end }}
    clientConfig:
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ .Release.Name }}-admission
        path: /admission/{{ .Values.mode }}
        port: 443
      {{- if not .Values.admission.certManagerCertificate }}
      caBundle: {{ required "admission.caBundle is required" .Values.admission.caBundle | quote }}
      {{- end }}
    rules:
      - apiGroups: [{{ if eq .Values.mode "gateway" }}gateway.networking.k8s.io{{ else }}networking.k8s.io{{ end }}]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: {{ if eq .Values.mode "gateway" }}[gateways, httproutes, grpcroutes]{{ else }}[ingresses]{{ end }}
        scope: Namespaced
{{- end }}
