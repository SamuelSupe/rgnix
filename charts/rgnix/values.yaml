replicaCount: 2
image:
  repository: ghcr.io/samuelsupe/rgnix
  tag: "0.3.0"
  pullPolicy: IfNotPresent
ingressClass: rgnix
mode: ingress
gateway:
  className: rgnix
  createClass: true
  name: ""
  # CRDs are installed separately by the cluster administrator.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
defaultIngressClass: false
watchNamespaces: []
service:
  type: LoadBalancer
  loadBalancerClass: ""
  allocateLoadBalancerNodePorts: true
  httpPort: 80
  httpsPort: 443
  externalTrafficPolicy: Cluster
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 512Mi
threads: 2
maxInflight: 1024
maxPluginInstances: 32
upstreamMaxFails: 3
upstreamFailTimeoutSeconds: 10

forwarding:
  trustedProxies: []
  header: x-forwarded-for
  recursive: false
  proxyProtocol: false
tenancy:
  policyConfigMap:
    name: ""
    key: policy.json
admin:
  usersSecret:
    name: ""
    key: users.json
  readTokenSecret:
    name: ""
    key: token
  tokenSecret:
    name: ""
    key: token
otlpTraces:
  endpoint: ""
  sampleRatio: 0.1
  headersSecret:
    name: ""
    key: headers
  caConfigMap:
    name: ""
    key: ca.crt

# Empty endpoint keeps OTLP access-log export disabled. The URL includes /v1/logs.
otlpLogs:
  endpoint: ""
  serviceName: rgnix
  resourceAttributes: ""
  headersSecret:
    name: ""
    key: headers
  # Optional PEM CA bundle from a ConfigMap; system trust remains enabled.
  caConfigMap:
    name: ""
    key: ca.crt

globalRateLimit:
  secret:
    name: ""
    key: config.json

rolloutMetrics:
  secret:
    name: ""
    key: metrics.json
admission:
  enabled: false
  tlsSecret: ""
  caBundle: ""
  failurePolicy: Fail
  namespaceSelector: {}
